name: guia_telefonica
description: Guía Telefónica Colaborativa - Offline-first con Supabase
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Base de datos local
  sqflite: 2.3.3+2
  path_provider: 2.1.5
  path: 1.9.0

  # Supabase (nube)
  supabase_flutter: 2.5.9

  # Manejo de estado
  flutter_riverpod: 2.5.1

  # Conectividad
  connectivity_plus: 6.0.5

  # Almacenamiento seguro
  flutter_secure_storage: 9.2.2

  # Fechas y formateo
  intl: 0.19.0

  # Exportacion/Importacion
  share_plus: 9.0.0
  file_picker: 8.0.6
  csv: 6.0.0

  # Permisos
  permission_handler: 11.3.1

  # Llamadas y URLs
  url_launcher: 6.3.0

  # Preferencias locales (tema)
  shared_preferences: 2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0
  build_runner: 2.4.11
  json_serializable: 6.8.0

flutter:
  uses-material-design: true
