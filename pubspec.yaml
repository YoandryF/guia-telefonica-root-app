name: guia_telefonica
description: Guía Telefónica Colaborativa - Offline-first con Supabase
publish_to: 'none'
version: 4.1.2+62

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Base de datos local
  sqflite: ^2.3.3+1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Supabase (nube)
  supabase_flutter: ^2.8.0

  # Manejo de estado
  flutter_riverpod: ^2.6.1

  # Conectividad
  connectivity_plus: ^6.1.1

  # Almacenamiento seguro
  flutter_secure_storage: ^9.2.2

  # Fechas y formateo
  intl: ^0.19.0

  # Exportacion/Importacion
  share_plus: ^9.0.0
  file_picker: ^8.0.7
  csv: ^6.0.0

  # Permisos
  permission_handler: ^11.3.1

  # Llamadas y URLs
  url_launcher: ^6.3.1

  # Deep links
  app_links: ^6.3.2

  # Auto-actualización
  http: ^1.2.1
  package_info_plus: ^8.0.3

  # Preferencias locales (tema)
  shared_preferences: ^2.3.3

  # QR
  qr_flutter: ^4.1.0

  # Evidencias (cámara/galería)
  image_picker: ^1.1.2

  # PDF
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon.png"
  adaptive_icon_background: "#0284c7"
  adaptive_icon_foreground: "assets/icon-foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/cuba_ubicaciones.json
