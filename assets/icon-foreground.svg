<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <!-- Foreground para launcher icon (adaptive) -->
  <!-- Safe zone: 18-90 (66% central) -->
  
  <!-- Nodo persona principal (grande, protagonista) -->
  <circle cx="54" cy="30" r="9" fill="white"/>
  <path d="M 54 39 C 43 39 38 47 38 52 L 38 55 C 38 57 40 58 42 58 L 66 58 C 68 58 70 57 70 55 L 70 52 C 70 47 65 39 54 39 Z" fill="white"/>
  
  <!-- Conexiones (gruesas, visibles) -->
  <line x1="54" y1="58" x2="36" y2="74" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  <line x1="54" y1="58" x2="72" y2="74" stroke="white" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
  
  <!-- 2 nodos conectados (grandes, con contraste) -->
  <circle cx="36" cy="76" r="10" fill="white" opacity="0.9"/>
  <circle cx="72" cy="76" r="10" fill="white" opacity="0.9"/>
  
  <!-- Siluetas personas en nodos (simplifican a puntos) -->
  <circle cx="36" cy="73" r="4" fill="#0284c7"/>
